             L 218,198 
             C 218,210 208,218 194,218 
             L 106,218 
             C 92,218 82,210 82,198 
             L 82,180 
             L 128,180 
             L 128,192 
             C 128,194 130,196 134,196 
             L 166,196 
             C 170,196 172,194 172,192 
             L 172,176 
             C 172,171 169,168 164,167 
             L 106,153 
             C 91,150 82,140 82,126 
