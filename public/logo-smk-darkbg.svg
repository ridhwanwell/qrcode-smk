             C 328,272 396,258 454,214 
             C 475,198 488,182 494,170 
             C 496,163 488,168 480,176 
             C 436,220 376,244 316,246 
             C 240,248 188,228 164,194 
             C 160,186 156,181 158,186 Z" 
