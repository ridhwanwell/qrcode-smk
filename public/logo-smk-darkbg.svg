<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 750 360" width="750" height="360">
  <defs>
    <!-- Background if requested -->
    <rect width="100%" height="100%" fill="#000000" />

    <!-- Metallic Gradient for Letters S & M -->
    <linearGradient id="smkMetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9CA2AA" />
      <stop offset="18%" stop-color="#81878F" />
      <stop offset="50%" stop-color="#50545A" />
      <stop offset="85%" stop-color="#282A2D" />
      <stop offset="100%" stop-color="#18191B" />
    </linearGradient>

    <!-- Silver Orbit Outer Gradient -->
    <linearGradient id="smkSilverOuter" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5C6269" />
      <stop offset="30%" stop-color="#9AA0A8" />
      <stop offset="65%" stop-color="#E2E7ED" />
      <stop offset="100%" stop-color="#828890" />
    </linearGradient>

    <!-- Silver Orbit Inner Split -->
    <linearGradient id="smkSilverInner" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3A3E43" />
      <stop offset="50%" stop-color="#7D838B" />
      <stop offset="100%" stop-color="#4D5157" />
    </linearGradient>

    <!-- Electric Cyan-Blue Gradient for Letter K -->
    <linearGradient id="smkCyanK" x1="0%" y1="0%" x2="35%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="20%" stop-color="#00D2FF" />
      <stop offset="60%" stop-color="#0095FF" />
      <stop offset="100%" stop-color="#0065EE" />
    </linearGradient>

    <!-- Electric Cyan-Blue Gradient for Lower Swoosh -->
    <linearGradient id="smkCyanSwoosh" x1="0%" y1="0%" x2="100%" y2="30%">
      <stop offset="0%" stop-color="#0060E6" />
      <stop offset="25%" stop-color="#009FFF" />
      <stop offset="60%" stop-color="#00EAFF" />
      <stop offset="88%" stop-color="#00B0FF" />
      <stop offset="100%" stop-color="#006CE0" />
    </linearGradient>
  </defs>

  <g transform="translate(55, 30)">
